name: Build & Release Sayuni APK

on:
  push:
    branches: [ main ]
    paths:
      - 'sayuni/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Version
        run: flutter --version

      - name: Install Dependencies
        working-directory: ./sayuni
        run: flutter pub get

      # Release signing: `flutter build apk --release` FAILS without a
      # keystore (no key.properties in the repo — by design, secrets are
      # never committed). If the signing secrets are configured in GitHub
      # (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD), decode them and build a
      # properly signed release. Otherwise build a DEBUG apk and label it
      # clearly — never publish a debug build as "Release".
      - name: Set up release signing (if secrets configured)
        id: signing
        working-directory: ./sayuni/android
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Signing secrets found — configuring release keystore."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/release.jks
            cat > key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.jks
          EOF
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets — will build DEBUG apk (demo only)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android APK (signed release if secrets present)
        working-directory: ./sayuni
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            flutter build apk --release
          else
            flutter build apk --debug
          fi

      - name: Prepare APK Artifacts
        run: |
          mkdir -p release-artifacts
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            cp sayuni/build/app/outputs/flutter-apk/app-release.apk release-artifacts/Zion-Jerusalem-Release.apk
            cp sayuni/build/app/outputs/flutter-apk/app-release.apk release-artifacts/Zion-Jerusalem-v1.0.0.apk
          else
            cp sayuni/build/app/outputs/flutter-apk/app-debug.apk release-artifacts/Zion-Jerusalem-Debug-Demo.apk
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zion-Jerusalem-APK
          path: release-artifacts/*
          retention-days: 30

      # Only publish a GitHub Release for SIGNED builds. Debug demo APKs
      # stay as workflow artifacts so nobody mistakes them for official.
      - name: Create or Update GitHub Release (signed builds only)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' && steps.signing.outputs.signed == 'true'
        with:
          tag_name: v1.0.0-release
          name: Zion Jerusalem Mobile App (Release v1.0.0)
          body: |
            ## Zion Jerusalem Church — Mobile App (Toleo la Kwanza Rasmi)

            Karibu kwenye toleo rasmi la programu ya simu ya **Zion Jerusalem Church** (Hekalu la Sayuni - Mbagala Kwa Matope, Dar es Salaam).

            ### 🚀 Vipengele Vilivyopo:
            - **Sayuni AI (Copilot)**: Msaidizi mahiri wa Kiroho na Kiliturujia (Mtandaoni kupitia Inception Labs Mercury & Groq + Nje ya Mtandao bila intaneti).
            - **Biblia Takatifu (Kiswahili)**: Agano la Kale & Jipya na usomaji wa sauti (TTS).
            - **Tenzi za Rohoni**: Nyimbo zote 161 zenye maneno kamili na uwezo wa kutafuta.
            - **Redio ya Sayuni**: Utiririshaji wa redio ya kikanisa masaa 24/7.
            - **Makala & Mafundisho ya Biblia**: Maudhui na mafundisho yenye picha halisi na maelezo kamili.
            - **Ushuhuda & Taarifa za Kanisa**: Matangazo ya kikanisa, ratiba za ibada, na huduma zote.
            - **Huduma za Michango & Sadaka**: Ufuatiliaji wa sadaka na stakabadhi za PDF.

            ### 📲 Jinsi ya Kupakua:
            Pakua faili la `Zion-Jerusalem-Release.apk` hapa chini na usakinishe moja kwa moja kwenye simu yako ya Android.
          draft: false
          prerelease: false
          files: |
            release-artifacts/Zion-Jerusalem-Release.apk
            release-artifacts/Zion-Jerusalem-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
