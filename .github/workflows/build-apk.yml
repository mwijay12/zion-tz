name: Build & Release Sayuni APK

on:
  push:
    branches: [ main ]
    paths:
      - 'sayuni/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Version
        run: flutter --version

      - name: Install Dependencies
        working-directory: ./sayuni
        run: flutter pub get

      - name: Build Android APK
        working-directory: ./sayuni
        run: flutter build apk --release

      - name: Prepare APK Artifacts
        run: |
          mkdir -p release-artifacts
          cp sayuni/build/app/outputs/flutter-apk/app-release.apk release-artifacts/Zion-Jerusalem-Release.apk
          cp sayuni/build/app/outputs/flutter-apk/app-release.apk release-artifacts/Zion-Jerusalem-v1.0.0.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zion-Jerusalem-Release-APK
          path: release-artifacts/Zion-Jerusalem-Release.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-release
          name: Zion Jerusalem Mobile App (Release v1.0.0)
          body: |
            ## Zion Jerusalem Church — Mobile App (Toleo la Kwanza Rasmi)

            Karibu kwenye toleo rasmi la programu ya simu ya **Zion Jerusalem Church** (Hekalu la Sayuni - Mbagala Kwa Matope, Dar es Salaam).

            ### 🚀 Vipengele Vilivyopo:
            - **Sayuni AI (Copilot)**: Msaidizi mahiri wa Kiroho na Kiliturujia (Mtandaoni kupitia Inception Labs Mercury & Groq + Nje ya Mtandao bila intaneti).
            - **Biblia Takatifu (Kiswahili)**: Agano la Kale & Jipya na usomaji wa sauti (TTS).
            - **Tenzi za Rohoni**: Nyimbo zote 161 zenye maneno kamili na uwezo wa kutafuta.
            - **Redio ya Sayuni**: Utiririshaji wa redio ya kikanisa masaa 24/7.
            - **Makala & Mafundisho ya Biblia**: Maudhui na mafundisho yenye picha halisi na maelezo kamili.
            - **Ushuhuda & Taarifa za Kanisa**: Matangazo ya kikanisa, ratiba za ibada, na huduma zote.
            - **Huduma za Michango & Sadaka**: Ufuatiliaji wa sadaka na stakabadhi za PDF.

            ### 📲 Jinsi ya Kupakua:
            Pakua faili la `Zion-Jerusalem-Release.apk` hapa chini na usakinishe moja kwa moja kwenye simu yako ya Android.
          draft: false
          prerelease: false
          files: |
            release-artifacts/Zion-Jerusalem-Release.apk
            release-artifacts/Zion-Jerusalem-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
